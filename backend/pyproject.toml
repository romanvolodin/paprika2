[project]
name = "paprika"
version = "1.0.0"
description = "Backend for Paprika - simple VFX task tracker"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.4",
    "environs>=15.0.1",
    "pillow>=12.2.0",
    "psycopg>=3.3.3",
]

[dependency-groups]
dev = ["ruff>=0.15.10"]

[tool.ruff]
target-version = "py313"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
force-sort-within-sections = true
combine-as-imports = true
lines-after-imports = 2
